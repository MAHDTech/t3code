<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="temu-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8F1F" />
      <stop offset="52%" stop-color="#FB7701" />
      <stop offset="100%" stop-color="#DF5400" />
    </linearGradient>
    <linearGradient id="temu-shine" x1="256" y1="0" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gold-tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE14D" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
  </defs>

  <!-- Temu signature rounded orange tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#temu-bg)" />
  <rect x="16" y="16" width="480" height="240" rx="108" fill="url(#temu-shine)" />
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="92"
    stroke="#FFD100"
    stroke-opacity="0.45"
    stroke-width="6"
    stroke-dasharray="16 12"
  />

  <!-- Shopping bag with code brackets -->
  <g transform="translate(0, -10)">
    <!-- Bag handle -->
    <path
      d="M196 146C196 106 222 82 256 82C290 82 316 106 316 146"
      stroke="#FFD100"
      stroke-width="20"
      stroke-linecap="round"
    />
    <!-- Bag body -->
    <rect
      x="132"
      y="142"
      width="248"
      height="168"
      rx="32"
      fill="#FFFFFF"
      fill-opacity="0.16"
      stroke="#FFFFFF"
      stroke-width="18"
    />
    <!-- Code brackets </> inside the shopping bag -->
    <path
      d="M214 192L174 226L214 260"
      stroke="#FFFFFF"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M298 192L338 226L298 260"
      stroke="#FFFFFF"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M270 184L242 268"
      stroke="#FFD100"
      stroke-width="18"
      stroke-linecap="round"
    />
  </g>

  <!-- Flash-sale lightning badge -->
  <g transform="translate(362, 54)">
    <circle cx="48" cy="48" r="46" fill="#E5191F" stroke="#FFF4D6" stroke-width="8" />
    <path
      d="M54 18L26 52H47L41 78L70 44H49L54 18Z"
      fill="url(#gold-tag)"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linejoin="round"
    />
  </g>

  <!-- Geometric bold TEMU3 wordmark (x=64..444, y=344..434) -->
  <g fill="#FFFFFF">
    <!-- T (64..128) -->
    <path d="M64 344H128V363H106V434H86V363H64V344Z" />
    <!-- E (140..198) -->
    <path d="M140 344H198V362H160V379H192V396H160V416H198V434H140V344Z" />
    <!-- M (210..286) -->
    <path d="M210 344H231L248 394L265 344H286V434H267V379L254 418H242L229 379V434H210V344Z" />
    <!-- U (298..364) -->
    <path d="M298 344H318V398C318 409 323 416 331 416C339 416 344 409 344 398V344H364V400C364 422 351 436 331 436C311 436 298 422 298 400V344Z" />
    <!-- 3 (376..444, accented in coupon gold!) -->
    <path
      fill="#FFD100"
      d="M378 360C385 348 396 342 411 342C430 342 442 352 442 367C442 377 437 384 427 387C438 390 445 398 445 410C445 426 432 436 410 436C394 436 382 429 375 418L391 407C395 414 401 418 410 418C419 418 424 414 424 407C424 400 418 396 407 396H399V379H406C416 379 422 375 422 369C422 363 417 359 409 359C402 359 396 363 393 369L378 360Z"
    />
  </g>
</svg>
